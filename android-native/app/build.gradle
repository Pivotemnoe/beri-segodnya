apply plugin: 'com.android.application'

android {
    namespace = 'ru.berisegodnya.app'
    compileSdk = 36
    defaultConfig {
        applicationId = 'ru.berisegodnya.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = '0.2.0-native-pilot'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { checkReleaseBuilds = true; abortOnError = true }
}
dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    constraints { implementation 'androidx.annotation:annotation:1.9.1' }
}
