name: Native Android candidate
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths: ['android-native/**', 'android-twa/gradle/**', '.github/workflows/android-native.yml']
  workflow_dispatch:
    inputs:
      run_ui_qa:
        description: 'Read-only native UI QA on disposable cloud Android 13 (no production credentials)'
        type: boolean
        default: false
jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Pure app rules
        run: |
          mkdir -p "$RUNNER_TEMP/native-rules"
          javac -d "$RUNNER_TEMP/native-rules" android-native/app/src/main/java/ru/berisegodnya/app/AppRules.java android-native/tests/AppRulesTest.java
          java -cp "$RUNNER_TEMP/native-rules" ru.berisegodnya.app.AppRulesTest
      - name: Reuse audited dependency checksums
        run: |
          mkdir -p android-native/gradle
          cp android-twa/gradle/verification-metadata.xml android-native/gradle/verification-metadata.xml
      - name: Compile and lint native release
        run: android-twa/gradlew -p android-native --no-daemon --warning-mode fail --dependency-verification strict lintRelease assembleRelease
      - name: Disposable Android 13 UI QA
        if: github.event_name == 'workflow_dispatch' && inputs.run_ui_qa
        env:
          QA_OUTPUT: ${{ runner.temp }}/native-ui-qa
        run: |
          androidTools="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$androidTools/sdkmanager"
          test -x "$androidTools/avdmanager"
          "$androidTools/sdkmanager" 'system-images;android-33;google_apis;x86_64' 'emulator' 'platform-tools'
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/platform-tools/adb"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/beri-native-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$androidTools/avdmanager" create avd --force --name beri-native-qa --package 'system-images;android-33;google_apis;x86_64' --device pixel_4 --path "$ANDROID_AVD_HOME/beri-native-qa.avd"
          test -s "$ANDROID_AVD_HOME/beri-native-qa.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx beri-native-qa
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd beri-native-qa -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/beri-emulator.log" 2>&1 &
          emulatorPid=$!
          sleep 3
          if ! kill -0 "$emulatorPid"; then cat "$RUNNER_TEMP/beri-emulator.log"; exit 1; fi
          timeout 180 adb wait-for-device
          booted=false
          for attempt in $(seq 1 90); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          adb -s emulator-5554 shell input keyevent 82
          keytool -genkeypair -keystore "$RUNNER_TEMP/qa-only.jks" -storepass android-qa-only -keypass android-qa-only -alias qa -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Disposable QA, O=Not a production release, C=XX'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/qa-only.jks" --ks-pass pass:android-qa-only --key-pass pass:android-qa-only --out "$RUNNER_TEMP/native-qa.apk" android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          adb -s emulator-5554 install "$RUNNER_TEMP/native-qa.apk"
          python3 android-native/tests/native-ui-qa.py emulator-5554 "$QA_OUTPUT"
          adb -s emulator-5554 emu kill
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-android-unsigned-candidate
          path: |
            android-native/app/build/outputs/apk/release/*.apk
            android-native/app/build/reports/lint-results-release.*
            ${{ runner.temp }}/native-ui-qa/*
            ${{ runner.temp }}/beri-emulator.log
          if-no-files-found: error
          retention-days: 7
# Production signing is local. Cloud UI QA uses only a new disposable test key, never the protected release key.
